<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Wanderer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: one-screen game — status strip, canvas stage, answer panel docked below like a scroll unrolled under the scene */
:root{
  color-scheme: dark;
  --night:#0d1824;      /* page ground */
  --lacquer:#16222f;    /* panels */
  --lacquer-2:#1e2d3c;
  --line:#2c3e50;
  --paper:#eee5d1;      /* text */
  --mist:#93a6b1;       /* secondary text */
  --cinnabar:#d8432f;   /* accent: seal red */
  --gold:#e2b65a;
  --jade:#5fb59a;
  --hanzi:"Noto Serif SC","Songti SC","SimSun",serif;
  --brush:"Ma Shan Zheng","Kaiti SC","KaiTi",cursive;
  --ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-rows:auto minmax(180px,1fr) auto;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* status strip */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--brush);font-size:28px;line-height:1;color:var(--paper);display:flex;align-items:center;gap:8px}
.seal{font-family:var(--brush);background:var(--cinnabar);color:#fff4e6;font-size:15px;padding:3px 5px 1px;border-radius:3px;transform:rotate(-4deg)}
.hp{flex:1 1 180px;min-width:140px;display:grid;gap:3px}
.hp-label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.hp-bar{height:9px;background:#0a121b;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.hp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b52f22,var(--cinnabar));transition:width .3s}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:grid;line-height:1.1}
.stat b{font-size:19px;font-weight:600}
.stat small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.stat.combo b{color:var(--gold)}
.tools{display:flex;gap:6px;margin-left:auto}
.tool{background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--mist)}
.tool[aria-pressed="true"]{color:var(--paper);border-color:var(--gold)}

/* stage */
.stage{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pause-veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,20,.72);padding:12px}
.pause-box{display:grid;gap:10px;justify-items:center;text-align:center}
.pause-box h2{margin:0;font-family:var(--brush);font-weight:400;font-size:44px;line-height:1}
.pause-box p{margin:0;color:var(--mist);font-size:14px}
.pause-box .row{justify-content:center}
.pause-box .cta{font-size:16px;padding:10px 16px}

/* panel */
.panel{background:var(--lacquer);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:186px;position:relative}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cinnabar);border-radius:8px 8px 0 0;opacity:.8}

.road{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;min-height:156px}
.road-tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.road h2{margin:4px 0 0;font-weight:500;font-size:17px;color:var(--mist)}
.recap{display:flex;gap:16px;align-items:center;background:var(--lacquer-2);border-radius:6px;padding:12px 16px;min-width:0}
.recap .rh{font-family:var(--hanzi);font-size:44px;line-height:1}
.recap .rp{color:var(--gold);font-size:17px}
.recap .re{font-size:17px}
.recap small{color:var(--mist);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.battle{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:stretch}
.prompt{display:grid;align-content:center;gap:6px;text-align:center}
.foe{font-size:13px;letter-spacing:.04em;color:var(--mist)}
.qh{font-family:var(--hanzi);font-size:56px;line-height:1.1;font-weight:600}
.qp{color:var(--gold);font-size:20px;min-height:1.2em}
.timer{position:relative;height:10px;background:#0a121b;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.timer i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--jade)}
.timer .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(238,229,209,.45)}
.tier{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.tier b{color:var(--gold);font-weight:700}
.tricks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.trick{font-size:12px;border:1px solid var(--cinnabar);color:#f0a090;border-radius:999px;padding:1px 9px;white-space:nowrap}
.trick b{font-family:var(--brush);font-weight:400;font-size:15px;margin-right:4px;color:var(--cinnabar)}
.qh.en-prompt{font-family:var(--ui);font-size:30px;font-weight:600;line-height:1.2;padding-block:8px}
.opt .en.hz{font-family:var(--hanzi);font-size:24px;font-weight:600}
.opt.eaten{background:repeating-linear-gradient(45deg,#2a1f2a 0 6px,#231a24 6px 12px);border-style:dashed;border-color:#7a4a5a}
.opt.eaten .en{font-family:var(--brush);font-size:24px;color:#e48b7a}
.opt .sub{display:block;font-size:12px;color:var(--mist)}
.options.coil .opt{animation:coil .4s ease}
@keyframes coil{0%{transform:translateX(-8px) rotate(-1.5deg)}50%{transform:translateX(8px) rotate(1.5deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.options.coil .opt{animation:none}}

.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;text-align:left;background:var(--lacquer-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:58px;transition:background .15s,border-color .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--mist)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt kbd{font-family:var(--ui);font-size:12px;color:var(--mist);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.opt .en{font-size:17px;font-weight:500;line-height:1.2}
.opt .reveal{display:block;font-size:13px;color:var(--mist);margin-top:2px}
.opt .reveal span{font-family:var(--hanzi);color:var(--paper);font-size:15px;margin-right:6px}
.opt:disabled{cursor:default}
.opt.right{background:#1d3b33;border-color:var(--jade)}
.opt.wrong{background:#3f1f1c;border-color:var(--cinnabar)}

/* overlays */
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;background:rgba(7,12,18,.82);backdrop-filter:blur(3px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--lacquer);border:1px solid var(--line);border-radius:10px;padding:28px 28px 24px;width:min(520px,100%);display:grid;gap:16px}
.card h1{margin:0;font-family:var(--brush);font-weight:400;font-size:64px;line-height:1;display:flex;align-items:center;gap:14px;text-wrap:balance}
.card h1 .seal{font-size:18px}
.card .sub{margin:-6px 0 0;color:var(--mist);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.cta{background:var(--cinnabar);border:0;border-radius:6px;padding:12px 18px;font-size:18px;font-weight:600;cursor:pointer;color:#fff7ec}
.cta:hover{filter:brightness(1.08)}
.fine{font-size:12px;color:var(--mist)}
.tagline{margin:0;font-size:16px}
#roadTag{text-transform:none;letter-spacing:.04em;font-size:13px}
.over-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-variant-numeric:tabular-nums}
.over-stats div{background:var(--lacquer-2);border-radius:6px;padding:8px;text-align:center}
.over-stats b{display:block;font-size:22px}
.over-stats small{font-size:11px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase}
.review{display:grid;gap:6px;max-height:200px;overflow:auto}
.review div{display:grid;grid-template-columns:70px 90px 1fr;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.review .h{font-family:var(--hanzi);font-size:20px}
.review .p{color:var(--gold)}
.review-empty{color:var(--mist);font-size:14px}

/* bestiary */
.book-veil{z-index:30}
.book{width:min(940px,100%);max-height:calc(100vh - 32px);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:20px 22px}
.book-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.book-head h1{font-size:44px}
.book-prog{color:var(--mist);font-variant-numeric:tabular-nums}
.book-prog b{color:var(--gold);font-size:19px}
.book-close{margin-left:auto}
#bookVeil .book{grid-template-rows:auto auto minmax(0,1fr)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;color:var(--mist)}
.tab b{font-family:var(--hanzi);font-weight:600;color:var(--paper);margin-right:4px}
.tab small{font-size:11px;margin-left:4px;color:var(--mist)}
.tab[aria-selected="true"]{border-color:var(--gold);background:#24364a;color:var(--paper)}
.chip.lc{text-transform:none;letter-spacing:.02em;font-size:13px}
.tile .where{position:absolute;top:5px;right:7px;font-family:var(--hanzi);font-size:11px;color:var(--mist)}
.lair{display:flex;gap:8px;flex-wrap:wrap}
.lair button{display:flex;align-items:center;gap:8px;background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
.lair button:hover{border-color:var(--mist)}
.lair b{font-family:var(--hanzi);font-weight:600;font-size:16px}
.lair small{display:block;font-size:11px;color:var(--mist);letter-spacing:.06em;text-transform:uppercase}
.book-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,350px);gap:16px;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;align-content:start;overflow:auto;padding:2px}
.tile{display:grid;justify-items:center;gap:2px;background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:8px 6px 10px;cursor:pointer;position:relative}
.tile:hover{border-color:var(--mist)}
.tile[aria-selected="true"]{border-color:var(--gold);background:#24364a}
.tile canvas{width:100%;height:78px;display:block}
.tile .tn{font-family:var(--hanzi);font-size:18px;line-height:1.2}
.tile .tp{font-size:12px;color:var(--mist);min-height:1.2em}
.tile .ts{font-size:13px;color:var(--gold);letter-spacing:.12em;min-height:1.2em}
.tile.locked .tn{color:var(--mist)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.tile .dot{position:absolute;top:8px;left:8px}
.r-common{background:var(--mist)}.r-uncommon{background:var(--jade)}.r-rare{background:var(--gold)}.r-boss{background:var(--cinnabar)}
.detail{background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start;overflow:auto;min-width:0}
.detail canvas{width:100%;height:180px;display:block;border-radius:6px;background:radial-gradient(ellipse at 50% 92%,#2a4258 0,#1b2b3b 45%,var(--lacquer) 75%)}
.d-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.d-name .h{font-family:var(--hanzi);font-size:40px;line-height:1}
.d-name .p{color:var(--gold);font-size:19px}
.d-name .tool{margin-left:auto;align-self:center}
.d-en{color:var(--mist);font-size:15px;margin-top:-6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mist)}
.chip.st{color:var(--gold);letter-spacing:.12em}
.chars{display:flex;gap:8px;flex-wrap:wrap}
.char{display:grid;justify-items:center;background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:66px}
.char .h{font-family:var(--hanzi);font-size:26px;line-height:1.15}
.char .p{color:var(--gold);font-size:13px}
.char .m{font-size:12px;color:var(--mist);text-align:center}
.lore{margin:0;font-size:15px;line-height:1.5}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-variant-numeric:tabular-nums}
.d-stats div{background:var(--lacquer);border-radius:6px;padding:6px}
.d-stats b{display:block;font-size:18px}
.d-stats small{font-size:11px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--mist);font-size:14px;margin:0}
.newly{font-size:14px;color:var(--mist)}
.newly b{font-family:var(--hanzi);color:var(--gold);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cta.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}

/* book of shame */
.shame{width:min(860px,100%);grid-template-rows:auto auto minmax(0,1fr)}
.shame-top{display:grid;gap:10px}
.shame-sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.shame-sum .big{font-family:var(--hanzi);font-size:30px;font-weight:600;color:var(--cinnabar)}
.shame-sum small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.shame-sum b{font-size:20px;font-variant-numeric:tabular-nums}
.shame-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shame-bar .cta{font-size:15px;padding:8px 14px;margin-left:auto}
.shame-bar .cta:disabled{background:transparent;border:1px solid var(--line);color:var(--mist);cursor:default}
.shame-list{display:grid;gap:8px;overflow:auto;min-height:0;align-content:start;padding-right:2px}
.srow{display:grid;grid-template-columns:28px minmax(90px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.srow .rk{font-family:var(--brush);font-size:20px;color:var(--mist);text-align:center}
.srow .hz{font-family:var(--hanzi);font-size:28px;font-weight:600;line-height:1.1}
.srow .py{color:var(--gold);font-size:14px}
.srow .en{font-size:15px}
.srow .cf{font-size:13px;color:var(--mist)}
.srow .cf i{font-style:normal;color:#e48b7a}
.srow .side{display:grid;justify-items:end;gap:4px}
.srow .n{font-size:20px;font-weight:700;color:var(--cinnabar);font-variant-numeric:tabular-nums}
.stamp{font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;border:1.5px solid currentColor;transform:rotate(-3deg);white-space:nowrap}
.stamp.t1{color:var(--mist)}.stamp.t2{color:var(--gold)}.stamp.t3{color:var(--cinnabar)}.stamp.ok{color:var(--jade)}
.srow.redeemed{opacity:.75}
.srow .tool{padding:3px 8px;font-size:12px}
.shame-empty{color:var(--mist);text-align:center;padding:30px 10px}
.shame-empty b{display:block;font-family:var(--brush);font-size:40px;color:var(--jade);font-weight:400}
@media (max-width:720px){.shame{display:block;overflow:auto}.shame>*+*{margin-top:12px}.shame-list{overflow:visible}
  .srow{grid-template-columns:minmax(64px,auto) minmax(0,1fr)}.srow .rk{display:none}.srow .hz{font-size:24px}
  .srow .side{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:flex-start}.srow .side .tool{margin-left:auto}}

/* shop */
.shop{width:min(1000px,100%)}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;overflow:auto;min-height:0;align-content:start}
.skin{background:var(--lacquer-2);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start}
.skin.on{border-color:var(--gold)}
.skin canvas{width:100%;height:150px;display:block;border-radius:6px;background:radial-gradient(ellipse at 50% 88%,#2a4258 0,#1b2b3b 45%,var(--lacquer) 78%)}
.skin .d-name .h{font-size:32px}
.skin .lore{font-size:14px}
.skin .cta{width:100%;font-size:16px;padding:10px 12px}
.skin .cta:disabled{background:transparent;border:1px solid var(--line);color:var(--mist);cursor:default}
.wallet-n{color:var(--gold);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{color:var(--jade);margin-left:10px}
@media (max-width:720px){.skins{grid-template-columns:1fr;overflow:visible}}

/* story */
.story{position:fixed;inset:0;z-index:50;background:#05080d;display:grid;grid-template-rows:minmax(0,1fr) auto}
.story canvas{width:100%;height:100%;display:block;min-height:0}
.story-cap{background:linear-gradient(transparent,rgba(5,8,13,.92) 25%);margin-top:-60px;position:relative;text-align:center;display:grid;gap:4px;justify-items:center;
  padding:40px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.story-cap.in{animation:capin .6s ease both}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.story-who{font-size:13px;letter-spacing:.08em;color:var(--gold)}
.story-zh{font-family:var(--hanzi);font-weight:600;font-size:clamp(24px,4.5vw,40px);line-height:1.25;text-wrap:balance;max-width:900px}
.story-py{color:var(--gold);font-size:16px;min-height:1.2em}
.story-en{color:var(--mist);font-size:16px;max-width:640px;text-wrap:balance}
.story-ui{display:flex;gap:10px;align-items:center;margin-top:10px}
.story-ui .cta{font-size:16px;padding:10px 18px;min-width:120px}
.story-dots{display:flex;gap:6px;margin-right:6px}
.story-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.story-dots i.on{background:var(--gold)}
@media (prefers-reduced-motion:reduce){.story-cap.in{animation:none}}

/* campaign map */
.atlas{width:min(1040px,100%)}
.atlas .book-body{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
.map-wrap{background:radial-gradient(ellipse at 55% 45%,#16283a 0,#111d2a 70%);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;min-height:0;overflow:hidden}
.map-wrap svg{width:100%;height:auto;max-height:100%;display:block}
#mapSvg .land{fill:#22374b;stroke:#4a6680;stroke-width:1;stroke-linejoin:round}
#mapSvg .land-glow{fill:#3b5a78;opacity:.35}
#mapSvg .mt{fill:none;stroke:#5e7c96;stroke-width:1.4;stroke-linejoin:round;opacity:.7}
#mapSvg .sand{fill:var(--gold);opacity:.35}
#mapSvg .river{fill:none;stroke:#6aa6c2;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
#mapSvg .rlabel{fill:#8fc0d6;font-family:var(--brush);font-size:12px}
#mapSvg .crack{fill:none;stroke:#0d1824;stroke-width:2.6;stroke-linejoin:miter}
#mapSvg .route{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:5 5;opacity:.6}
#mapSvg .node{cursor:pointer;outline:none}
#mapSvg .dotc{fill:var(--lacquer);stroke:var(--gold);stroke-width:2}
#mapSvg .node.cleared .dotc{fill:var(--cinnabar);stroke:#f0c97a}
#mapSvg .num{fill:var(--paper);font-family:var(--brush);font-size:15px;text-anchor:middle}
#mapSvg .nlabel{fill:var(--paper);font-family:var(--hanzi);font-size:15px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#0d1824;stroke-width:3.5px}
#mapSvg .ring{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 4;opacity:0}
#mapSvg .node.sel .ring,#mapSvg .node:focus-visible .ring{opacity:1;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
#mapSvg .node:hover .dotc{stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
.road-tag .open{color:var(--jade)}
.detail canvas.scene{height:140px;background:none;border:1px solid var(--line)}
#overSub{text-transform:none;letter-spacing:.02em}
.goal{font-size:15px;background:var(--lacquer);border-radius:6px;padding:8px 10px}
.goal b{font-family:var(--hanzi);color:var(--gold);font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.wchip{display:grid;justify-items:center;background:var(--lacquer);border:1px solid var(--line);border-radius:5px;padding:4px 2px;cursor:help;min-width:0}
.wchip b{font-family:var(--hanzi);font-weight:600;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wchip small{font-size:11px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wchip.seen{border-color:#56708a}
.wchip.known{border-color:var(--jade)}
.wchip.known small{color:var(--jade)}
@media (prefers-reduced-motion:reduce){#mapSvg .node.sel .ring{animation:none}}

@media (max-width:720px){
  .book{display:block;overflow:auto}
  .book>*+*{margin-top:12px}
  .book-head h1{font-size:34px}
  .book-body{grid-template-columns:1fr}
  .detail{order:-1;overflow:visible}
  .atlas .book-body{grid-template-columns:1fr}
  .atlas .map-wrap{order:-2}
  .tiles{overflow:visible;grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail canvas{height:150px}
}
@media (max-width:720px){
  .app{gap:8px;padding-block:8px;grid-template-rows:auto minmax(150px,1fr) auto}
  .brand{font-size:22px}
  .stats{gap:12px}
  .stat b{font-size:16px}
  .battle{grid-template-columns:1fr;gap:10px}
  .qh{font-size:42px}
  .prompt{gap:3px}
  .opt{min-height:50px;padding:8px 10px}
  .opt .en{font-size:15px}
  .road{grid-template-columns:1fr;gap:10px;min-height:0}
  .card h1{font-size:48px}
  .over-stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){ .hp-bar i,.opt{transition:none} }
</style>

<body>


<div class="app">
  <header class="status">
    <div class="brand">汉字侠 <span class="seal">HSK3</span></div>
    <div class="hp">
      <div class="hp-label"><span id="heroName">Wanderer</span><span id="hpText">100 / 100</span></div>
      <div class="hp-bar"><i id="hpFill"></i></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDist">0.00</b><small>里 li</small></div>
      <div class="stat"><b id="sKills">0</b><small id="sKillsLabel">Foes</small></div>
      <div class="stat"><b id="sCoins">0</b><small>铜钱</small></div>
      <div class="stat combo"><b id="sCombo">×0</b><small>Combo</small></div>
    </div>
    <div class="tools">
      <button class="tool" id="tPinyin" aria-pressed="true">拼音</button>
      <button class="tool" id="tVoice" aria-pressed="true">Voice</button>
      <button class="tool" id="tBook">图鉴 Bestiary</button>
      <button class="tool" id="tPause" aria-pressed="false">Menu</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="pause-veil" id="pauseVeil" hidden>
      <div class="pause-box" role="dialog" aria-labelledby="pauseTitle">
        <h2 id="pauseTitle">暂停</h2>
        <p id="pauseNote">Leaving ends this run.</p>
        <div class="row">
          <button class="cta" id="resumeBtn">Keep running</button>
          <button class="cta ghost" id="quitMapBtn">Back to map</button>
          <button class="cta ghost" id="quitMenuBtn">Main menu</button>
        </div>
      </div>
    </div>
  </div>

  <section class="panel" id="panel">
    <div class="road" id="roadView">
      <div>
        <div class="road-tag" id="roadTag">On the road</div>
      </div>
      <div class="recap" id="recap" hidden>
        <div class="rh" id="rH"></div>
        <div>
          <small>Last word</small>
          <div class="rp" id="rP"></div>
          <div class="re" id="rE"></div>
        </div>
      </div>
    </div>
    <div class="battle" id="battleView" hidden>
      <div class="prompt">
        <div class="foe" id="foeName"></div>
        <div class="tricks" id="tricks" hidden></div>
        <div class="qh" id="qH"></div>
        <div class="qp" id="qP"></div>
        <div class="timer" id="timer"><i id="timerFill"></i></div>
        <div class="tier" id="tier"></div>
      </div>
      <div class="options" id="options"></div>
    </div>
  </section>
</div>

<div class="veil" id="titleVeil">
  <div class="card">
    <h1>汉字侠 <span class="seal">HSK3</span></h1>
    <p class="sub">Hanzi Wanderer</p>
    <p class="tagline">Pick the meaning. Faster hits harder.</p>
    <div class="toggles">
      <button class="tool" id="tPinyin2" aria-pressed="true">Show pinyin</button>
      <button class="tool" id="tVoice2" aria-pressed="true">Speak words</button>
    </div>
    <div class="row">
      <button class="cta" id="startBtn">征途 Campaign</button>
      <button class="cta ghost" id="freeBtn">自由跑 Free run</button>
      <button class="cta ghost" id="bookBtn1">图鉴 Bestiary</button>
      <button class="cta ghost" id="shopBtn">商店 Shop</button>
      <button class="cta ghost" id="shameBtn">错题本 Book of Shame</button>
    </div>
  </div>
</div>

<div class="veil" id="overVeil" hidden>
  <div class="card">
    <h1><span id="overTitle">倒下</span> <span class="seal" id="overSeal">Fallen</span></h1>
    <p class="sub" id="overSub" hidden></p>

    <div class="newly" id="newly" hidden></div>
    <div class="row">
      <button class="cta" id="nextBtn" hidden>Next stage</button>
      <button class="cta" id="againBtn">Run again</button>
      <button class="cta ghost" id="mapBtn" hidden>征途 Map</button>
      <button class="cta ghost" id="bookBtn2">图鉴 Bestiary</button>
      <button class="cta ghost" id="menuBtn">Main menu</button>
    </div>
  </div>
</div>

<div class="veil" id="mapVeil" hidden>
  <div class="card book atlas" role="dialog" aria-modal="true" aria-labelledby="mapTitle">

      <button class="tool" id="endingBtn" hidden>终 Ending</button>
      <button class="tool" id="mapClose">Back</button>

  </div>
</div>

<div class="story" id="story" hidden role="dialog" aria-modal="true" aria-label="Story">

<div class="veil" id="shameVeil" hidden>

    <div class="shame-list" id="shameList"></div>
  </div>
</div>

<div class="veil" id="shopVeil" hidden>

    </div>

</div>

<div class="veil book-veil" id="bookVeil" hidden>

  </div>
</div>

/* ---------- words ---------- */
function weight(w){
  const m=store.mastery[wid(w)]; if(!m) return 1.5;
  return Math.max(.3,Math.min(6,1+2*m.w-.5*m.c));
}
function pickWord(){
  const pool=G.pool.filter(w=>!G.recent.includes(wid(w)));
  let sum=pool.reduce((a,w)=>a+weight(w),0), r=Math.random()*sum;
  for(const w of pool){r-=weight(w); if(r<=0) return w;}
  return pool[pool.length-1];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- audio ---------- */
let ac=null;
function blip(f1,f2,dur,type="triangle",vol=.08){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur);
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.connect(g).connect(ac.destination);o.start(n);o.stop(n+dur);}catch(e){}
}
function speak(txt,force){
  if(!store.voice&&!force) return;
  try{const s=window.speechSynthesis; if(!s) return; s.cancel();
    const m=new SpeechSynthesisUtterance(txt);m.lang="zh-CN";m.rate=.85;
    const v=s.getVoices().find(v=>/zh[-_]CN/i.test(v.lang)); if(v) m.voice=v; s.speak(m);}catch(e){}
}

/* ---------- flow ---------- */
function spawnEnemy(){
  const n=G.kills+1; let kind;
  if(G.mode==="campaign"&&n===BOSS_AT) kind=REGIONS[G.region].boss;
  else if(G.mode!=="campaign"&&n%5===0) kind=(n/5)%2===1?"nian":"bull";
  else{
    const pool=[["jiangshi",2.4],["fox",2.4],["shuigui",2.4],["wolf",2.4],["guihuo",2.4],["lion",1.3],["baigujing",1.1],["jiutouniao",1.1]];
    if(G.kills>=3) pool.push(["qilin",.45]);
    if(G.mode==="campaign") for(const k in FOES){const f=FOES[k];if(f.where===G.region&&f.rarity!=="boss")pool.push([k,6]);}
    let r=Math.random()*pool.reduce((a,p)=>a+p[1],0); kind=(pool.find(p=>(r-=p[1])<=0)||pool[0])[0];
  }
  const f=FOES[kind], hp=Math.round(f.hp*(1+.08*G.kills)*(f.rarity==="boss"?1.25:1)), b=beast(kind);
  G.enemy={kind,f,hp,max:hp,x:W+60*u,anim:null,flash:0,dying:0,born:t,isNew:!b.seen};
  if(!b.seen){b.seen=true;b.first=Date.now();save();}
}
function startQuestion(){
  const w=pickWord();
  G.recent.push(wid(w)); if(G.recent.length>4) G.recent.shift();
  const others=[];
  for(const x of shuffle((G.dpool||G.pool).slice())){ if(others.length===3) break;
    if(!confusable(w,x)&&!others.some(o=>o[2]===x[2])) others.push(x); }
  const opts=shuffle([w,...others]),correct=opts.indexOf(w),tr=bossTricks(G.enemy);
  const q={w,opts,correct,elapsed:0,done:false,tricks:tr,T:tr.includes("heat")?6:TIME,
    hidePy:tr.includes("roar")||tr.includes("mirror"),mirror:tr.includes("mirror"),eaten:-1,coilAt:null};
  if(tr.includes("devour")){const others2=[0,1,2,3].filter(k=>k!==correct);q.eaten=Math.random()<.35?correct:others2[Math.random()*3|0];}
  if(tr.includes("coil")) q.coilAt=1+Math.random()*1.5;
  G.q=q;
  const e=G.enemy;if(tr.length&&!e.announced){e.announced=true;
    floater(tr.map(k=>TRICKS[k][0]).join(" "),e.x,gy-e.f.h*u*sc(e.f)*.55,"#ff8a6a",30,true);blip(140,70,.5,"sawtooth",.06);G.shake=6;}
  renderQuestion();
}
function renderQuestion(){
  const q=G.q,e=G.enemy;
  $("roadView").hidden=true;$("battleView").hidden=false;
  $("foeName").textContent=`${e.f.cn}${store.pinyin?" "+e.f.py:""} · ${e.f.en}`;
  const tk=$("tricks");tk.hidden=!q.tricks.length;
  tk.innerHTML=q.tricks.map(k=>`<span class="trick"><b>${TRICKS[k][0]}</b>${TRICKS[k][1]}</span>`).join("");
  const qh=$("qH");qh.className="qh"+(q.mirror?" en-prompt":"");qh.textContent=q.mirror?q.w[2]:q.w[0];
  $("qP").textContent=store.pinyin&&!q.hidePy?q.w[1]:"";
  const box=$("options");box.innerHTML="";box.classList.remove("coil");
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt"+(i===q.eaten?" eaten":"");b.dataset.i=i;
    b.innerHTML=`<kbd>${i+1}</kbd><span><span class="en"></span><span class="sub" hidden></span><span class="reveal" hidden></span></span>`;
    const en=b.querySelector(".en"),rv=b.querySelector(".reveal");
    if(i===q.eaten){en.textContent="？";const sb=b.querySelector(".sub");sb.hidden=false;sb.textContent="吃掉了 · eaten";}
    else if(q.mirror){en.textContent=o[0];en.classList.add("hz");}
    else en.textContent=o[2];
    rv.innerHTML=`<span></span>`;rv.firstChild.textContent=o[0];rv.append(o[1]+(q.mirror||i===q.eaten?" · "+o[2]:""));
    b.onclick=()=>answer(i);box.append(b);
  });
  const tm=$("timer");tm.querySelectorAll(".tick").forEach(x=>x.remove());
  [q.T/4,q.T/2].forEach(s=>{const k=document.createElement("span");k.className="tick";k.style.left=(100*(1-s/q.T))+"%";tm.append(k)});
  updateTimer();
}
function coil(){const q=G.q,box=$("options"),kids=[...box.children];let order;
  do{order=shuffle(kids.slice());}while(order.every((b,k)=>b===kids[k]));
  order.forEach((b,k)=>{b.querySelector("kbd").textContent=k+1;box.append(b);});
  box.classList.remove("coil");void box.offsetWidth;box.classList.add("coil");
  const e=G.enemy;if(e)floater("缠",e.x-30*u,gy-e.f.h*u*sc(e.f)*.5,"#ff8a6a",26,true);blip(220,160,.15,"triangle",.05);}
function tierOf(el){const T=G.q?G.q.T:TIME,T3=T/4,T2=T/2;return el<=T3?{m:3,cn:"神速",en:"Godspeed"}:el<=T2?{m:2,cn:"快",en:"Swift"}:{m:1,cn:"中",en:"Hit"}}
function updateTimer(){
  const q=G.q; if(!q) return;
  const left=Math.max(0,1-q.elapsed/q.T);
  const f=$("timerFill");f.style.width=(left*100)+"%";
  const tr=tierOf(q.elapsed);
  f.style.background=tr.m===3?"var(--gold)":tr.m===2?"var(--jade)":"var(--mist)";
  if(!q.done) $("tier").innerHTML=`<b>×${tr.m}</b> ${tr.cn}`;
}
function answer(i){
  const q=G.q; if(!q||q.done||G.paused||G.state!=="battle") return;
  q.done=true;
  const ok=i===q.correct, e=G.enemy, tr=tierOf(q.elapsed);
  G.answered++;

function update(dt){
  // effects keep animating unless paused
  if(G.paused) return;
  for(let i=G.timers.length-1;i>=0;i--){const k=G.timers[i];k.d-=dt;if(k.d<=0){G.timers.splice(i,1);k.fn()}}
  if(G.state==="run"){
    G.worldX+=speed*dt;G.meters+=dt*6;$("sDist").textContent=(G.meters/500).toFixed(2);
    if(!G.enemy){G.spawnIn-=dt;if(G.spawnIn<=0)spawnEnemy();}
    else{G.enemy.x-=speed*dt;if(G.enemy.x<=battleX){G.enemy.x=battleX;G.state="battle";startQuestion();}}
  }
  if(G.state==="battle"&&G.q&&!G.q.done){G.q.elapsed+=dt;updateTimer();if(G.q.coilAt&&!G.q.coiled&&G.q.elapsed>=G.q.coilAt){G.q.coiled=true;coil();}if(G.q.elapsed>=G.q.T)answer(-1);}
  const h=G.hero;if(h.anim){h.anim.t+=dt;if(h.anim.t>=h.anim.dur)h.anim=null;}h.hurt=Math.max(0,h.hurt-dt);
  const e=G.enemy;if(e){if(e.anim){e.anim.t+=dt;if(e.anim.t>=e.anim.dur)e.anim=null;}e.flash=Math.max(0,e.flash-dt);if(e.dying)e.dying=Math.min(1,e.dying+dt*1.4);}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];
    if(p.type==="p"){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*u*dt;if(p.life<=0)G.fx.splice(i,1)}
    else{p.t+=dt;if(p.t>.3)G.fx.splice(i,1)}}
  for(let i=G.floaters.length-1;i>=0;i--){const f=G.floaters[i];f.life-=dt;f.y-=40*u*dt;if(f.life<=0)G.floaters.splice(i,1)}
  G.shake=Math.max(0,G.shake-dt*30);
}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;t+=G.paused?0:dt;
  update(dt);draw();requestAnimationFrame(frame);
}

let c=ctx;

let WX=0;
function themeNight(){

  // stars

  for(let i=0;i<40;i++){const x=(hash(i)*W*1.3-WX*.01)%(W*1.3);const xx=x<0?x+W*1.3:x;circle(xx,hash(i+99)*gy*.5,(hash(i+7)*1.1+.3)*u*.8)}
  // moon

  const glow=c.createRadialGradient(mx,my,mr*.6,mx,my,mr*3.2);glow.addColorStop(0,"rgba(240,226,190,.35)");glow.addColorStop(1,"rgba(240,226,190,0)");
  c.fillStyle=glow;circle(mx,my,mr*3.2);c.fillStyle="#efe3c4";circle(mx,my,mr);
  c.fillStyle="rgba(200,185,150,.35)";circle(mx-8*u,my-5*u,5*u);circle(mx+7*u,my+8*u,3.5*u);
  // far ridge
  layer(.08,"#22374b",gy-95*u,40*u,1.3);
  // mid ridge + pagodas
  const off=WX*.25;
  layer(.25,"#18293a",gy-55*u,34*u,4.2);
  c.fillStyle="#18293a";
  for(let k=Math.floor((off-200)/1100);k<=Math.floor((off+W+200)/1100);k++){
    if(hash(k)<.45) continue;
    const wx=k*1100+300, px=wx-off, base=gy-55*u-ridge(wx/u,4.2,34*u)+4*u;
    pagoda(px,base,u*(.8+hash(k+3)*.4));
  }
  // mist
  const mist=c.createLinearGradient(0,gy-60*u,0,gy);mist.addColorStop(0,"rgba(120,140,155,0)");mist.addColorStop(1,"rgba(120,140,155,.22)");
  c.fillStyle=mist;c.fillRect(0,gy-60*u,W,60*u);
  // near hills
  layer(.55,"#122030",gy-18*u,14*u,7.7);
  // ground
  c.fillStyle="#0c151e";c.fillRect(0,gy,W,H-gy);
  c.fillStyle="#2a3a48";c.fillRect(0,gy,W,2*u);
  // road stones
  c.fillStyle="#1d2a36";
  const so=WX%(38*u);for(let x=-so;x<W;x+=38*u){c.fillRect(x,gy+7*u,22*u,3*u);c.fillRect(x+14*u,gy+16*u,26*u,3*u)}

  const lo=WX;

  }

  c.strokeStyle="#22323f";c.lineWidth=1.2*u;
  for(let k=Math.floor((lo-20)/47);k<=Math.floor((lo+W+20)/47);k++){
    if(hash(k*3)<.5)continue;const x=k*47-lo;

  }
}
function layer(par,color,base,amp,seed){

  c.fillStyle=stone;const so=m(WX,38*u);for(let x=-so;x<W;x+=38*u){c.fillRect(x,gy+7*u,22*u,3*u);c.fillRect(x+14*u,gy+16*u,26*u,3*u)}}

  const x=m(a*W*1.4-t*vx*u*(.6+k)-WX*.9,W*1.4)-W*.2, y=m(b*(H+20*u)+t*vy*u*(.6+k*.8),H+20*u)-10*u; fn(x,y,i,k);}}
function starfield(n,a){c.fillStyle=`rgba(238,229,209,${a})`;for(let i=0;i<n;i++)circle(m(hash(i)*W*1.3-WX*.01,W*1.3),hash(i+99)*gy*.5,(hash(i+7)*1.1+.3)*u*.8);}
/* Chinese hall roof with upturned eaves */

/* 敦煌 · dunes, caravans and the Mogao cliff */
function duneY(par,base,amp,seed,x){const xx=(x+WX*par)/u;return base-amp*(1-Math.abs(Math.sin(xx*.0045+seed)))*(.55+.45*Math.sin(xx*.0017+seed*2))}
function dunes(par,col,shade,crest,base,amp,seed){
  c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+6;x+=6)c.lineTo(x,duneY(par,base,amp,seed,x));c.lineTo(W,H);c.closePath();c.fill();
  c.fillStyle=shade;let prev=duneY(par,base,amp,seed,0);
  for(let x=0;x<=W;x+=4){const y=duneY(par,base,amp,seed,x+4);if(y>prev){const yy=Math.min(prev,y);c.fillRect(x,yy,4.5,Math.max(0,base+amp*.15-yy));}prev=y;}
  c.strokeStyle=crest;c.lineWidth=1.2*u;c.beginPath();for(let x=0;x<=W+6;x+=6){const y=duneY(par,base,amp,seed,x);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
}

  rep(260*u,.9,40*u,(x,k)=>{if(hash(k+3)<.4)return;c.strokeStyle="#7a5a34";c.lineWidth=1.2*u;
    for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*.32;line(x,gy,x+Math.cos(a)*(9+hash(k+i)*6)*u,gy+Math.sin(a)*(9+hash(k+i)*6)*u)}});
  fallers(26,8,140,4,(x,y,i,k)=>{c.strokeStyle=`rgba(250,228,180,${.2+k*.25})`;c.lineWidth=1*u;line(x,y,x+(10+k*12)*u,y)});

function caravan(par,base,amp,seed){
  rep(1500*u,par,80*u,(x0,k)=>{for(let j=0;j<5;j++){const x=x0+j*13*u,y=duneY(par,base,amp,seed,x)+.5*u;camel(x,y,.42*u,j+k,j===0);}});

function camel(x,y,s,ph,rider){
  c.fillStyle="#6b4a2c";c.strokeStyle="#6b4a2c";c.lineWidth=2*s;c.lineCap="round";
  const g=Math.sin(t*5+ph)*3*s;
  line(x-5*s,y-10*s,x-5*s+g,y);line(x-2*s,y-10*s,x-2*s-g,y);line(x+4*s,y-10*s,x+4*s-g,y);line(x+7*s,y-10*s,x+7*s+g,y);
  ell(x+1*s,y-13*s,8*s,4.5*s);circle(x+1*s,y-17*s,4*s);
  c.lineWidth=2.6*s;line(x+7*s,y-14*s,x+12*s,y-21*s);ell(x+13.5*s,y-21.5*s,3*s,1.7*s);
  if(rider){c.fillStyle="#3a2a20";c.fillRect(x-1*s,y-27*s,4*s,8*s);c.fillStyle="#e8e0cc";c.beginPath();c.moveTo(x-3*s,y-27*s);c.lineTo(x+6*s,y-27*s);c.lineTo(x+1.5*s,y-31*s);c.closePath();c.fill();}
}
function mogao(par){
  const off=WX*par, top=x=>gy-50*u-Math.sin((x+off)/u*.006)*6*u-Math.sin((x+off)/u*.019)*3*u;
  c.fillStyle="#b6844f";c.beginPath();c.moveTo(0,gy);for(let x=0;x<=W+6;x+=6)c.lineTo(x,top(x));c.lineTo(W,gy);c.closePath();c.fill();
  c.strokeStyle="rgba(110,70,35,.3)";c.lineWidth=1*u;
  for(let r=1;r<4;r++){c.beginPath();for(let x=0;x<=W+12;x+=12){const y=top(x)+r*11*u+Math.sin((x+off)/u*.03+r)*1.5*u;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();}
  rep(24*u,par,20*u,(x,k)=>{for(let r=0;r<3;r++){if(hash(k*3+r)<.35)continue;const y=top(x)+10*u+r*12*u;
    c.fillStyle="#4a2e1c";c.beginPath();c.arc(x,y,3*u,Math.PI,0);c.fill();c.fillRect(x-3*u,y,6*u,4*u);}});
  rep(1400*u,par,80*u,x=>{
    for(let i=0;i<7;i++){const w=(26-i*2.6)*u,yy=gy-i*10*u;c.fillStyle="#9c3a2a";c.fillRect(x-w*.6,yy-10*u,w*1.2,9*u);

      roof(x,yy-9.5*u,w,5*u,"#3a2016");}

  for(let i=0;i<4;i++){const x=W*(.05+i*.24)+Math.sin(t*.3+i)*10*u;c.beginPath();c.moveTo(x,0);c.lineTo(x+40*u,0);c.lineTo(x+150*u,gy);c.lineTo(x+70*u,gy);c.closePath();c.fill();}

function bamboo(par,col,leaf,period,wd,density){
  rep(period*u,par,40*u,(x,k)=>{if(hash(k*2.1+par*10)>density+.15)return;
    const lean=(hash(k+3)-.5)*24*u, top=-20*u, w=wd*u*(.8+hash(k)*.4), L=gy-top, ls=wd/4;
    c.strokeStyle=col;c.lineWidth=w;c.lineCap="butt";line(x,gy,x+lean,top);

    for(let j=1;j<9;j++){const p=j/9,nx=x+lean*p,ny=gy-L*p;line(nx-w*.6,ny,nx+w*.6,ny);}

      for(let l=0;l<3;l++){const a=.45+l*.38+Math.sin(t*1.5+k+j)*.08;c.save();c.translate(nx,ny);c.rotate(right?a:Math.PI-a);
        ell(9*u*ls,0,10*u*ls,1.8*u*ls+.6);c.restore();}}

}

  c.fillStyle="#7fb36a";ell(x-15*s,y-38*s,5*s,1.5*s);ell(x-11*s,y-33*s,4*s,1.3*s);
  c.fillStyle="#1d1f22";ell(x-7*s,y-15*s,3.5*s,6.5*s);
